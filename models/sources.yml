version: 2

sources:
  - name: earthquake_raw
    database: mindful-bivouac-481316-q7
    schema: earthquake
    description: Raw earthquake data loaded into BigQuery from static CSV and real-time USGS API.

    tables:
      - name: static_earthquake_data
        description: Cleaned static earthquake data loaded from USGS CSV using Spark.
        columns:
          - name: earthquake_id
            description: Unique earthquake event ID.
            tests:
              - not_null
              - unique
          - name: event_time
            description: Time when the earthquake occurred.
            tests:
              - not_null
          - name: latitude
            tests:
              - not_null
          - name: longitude
            tests:
              - not_null
          - name: magnitude
            tests:
              - not_null

      - name: realtime_earthquake_data
        description: Real-time earthquake data loaded from USGS GeoJSON API using Cloud Run and Cloud Scheduler.
        columns:
          - name: earthquake_id
            description: Unique earthquake event ID from USGS.
            tests:
              - not_null
          - name: event_time
            description: Time when the earthquake occurred.
            tests:
              - not_null
          - name: ingested_at
            description: Timestamp when the record was inserted into BigQuery.
            tests:
              - not_null

      - name: tectonic_plate_boundaries
        description: Tectonic plate boundary data loaded from public GeoJSON source.
        columns:
          - name: boundary_id
            description: Unique tectonic plate boundary ID.
            tests:
              - not_null
              - unique

          - name: boundary_name
            description: Tectonic plate boundary name or plate code.

          - name: boundary_type
            description: Type of tectonic plate boundary.

          - name: geometry_type
            description: Geometry type from the GeoJSON file.

          - name: boundary_wkt
            description: Plate boundary geometry stored as WKT text.
            tests:
              - not_null

          - name: source_url
            description: Source URL of the tectonic plate boundary data.

          - name: ingested_at
            description: Timestamp when the tectonic plate boundary data was loaded.
            tests:
              - not_null